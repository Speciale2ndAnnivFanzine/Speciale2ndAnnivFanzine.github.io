<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speciale 2nd Anniversary Fanzine</title>
    <meta name="description" content="A celebratory fanzine website for Speciale's second anniversary." />
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div class="container-fluid">
            <div class="row position-relative align-items-center top-0" style="height: auto;">
                <div class="col-5 p-0 d-flex">
                    <svg viewBox="0 0 150 180" style="width: 20%; height: auto;">
                        <rect width="100%" height="90" fill="#77B6C2" />
                        <circle cx="75" cy="90" r="75" fill="#77B6C2" />
                    </svg>
                    <svg viewBox="0 0 150 180" style="width: 20%; height: auto;">
                        <rect width="100%" height="90" fill="#FFD264" />
                        <circle cx="75" cy="90" r="75" fill="#FFD264" />
                    </svg>
                    <svg viewBox="0 0 150 180" style="width: 20%; height: auto;">
                        <rect width="100%" height="90" fill="#DF6D7C" />
                        <circle cx="75" cy="90" r="75" fill="#DF6D7C" />
                    </svg>
                    <svg viewBox="0 0 150 180" style="width: 20%; height: auto;">
                        <rect width="100%" height="90" fill="#BA6EA5" />
                        <circle cx="75" cy="90" r="75" fill="#BA6EA5" />
                    </svg>
                    <svg viewBox="0 0 150 180" style="width: 20%; height: auto;">
                        <rect width="100%" height="90" fill="#9DD9B9" />
                        <circle cx="75" cy="90" r="75" fill="#9DD9B9" />
                    </svg>
                </div>
                <div class="position-absolute top-0 start-50 translate-middle-x col-4">
                    <svg width="100%" height="auto;" viewBox="0 0 650 260" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M647.5 2.5V130C647.5 200.416 590.416 257.5 520 257.5H130C59.5837 257.5 2.5 200.416 2.5 130V2.5H647.5Z"
                            fill="white" />
                        <path
                            d="M647.5 2.5V130C647.5 200.416 590.416 257.5 520 257.5H130C59.5837 257.5 2.5 200.416 2.5 130V2.5H647.5Z"
                            stroke="#9DD9B9" stroke-width="5" />
                    </svg>
                </div>
                <div class="position-absolute top-50 start-50 translate-middle-x col-4 ">
                    <div class="heading-box">
                        <h1 class="heading">Oshikatsu</h1>
                    </div>
                </div>
                <div class="col-5 p-0 d-flex ms-auto">
                    <svg viewBox="0 0 150 180" style="width: 20%; height: auto;">
                        <rect width="100%" height="90" fill="#9DD9B9" />
                        <circle cx="75" cy="90" r="75" fill="#9DD9B9" />
                    </svg>
                    <svg viewBox="0 0 150 180" style="width: 20%; height: auto;">
                        <rect width="100%" height="90" fill="#BA6EA5" />
                        <circle cx="75" cy="90" r="75" fill="#BA6EA5" />
                    </svg>
                    <svg viewBox="0 0 150 180" style="width: 20%; height: auto;">
                        <rect width="100%" height="90" fill="#DF6D7C" />
                        <circle cx="75" cy="90" r="75" fill="#DF6D7C" />
                    </svg>
                    <svg viewBox="0 0 150 180" style="width: 20%; height: auto;">
                        <rect width="100%" height="90" fill="#FFD264" />
                        <circle cx="75" cy="90" r="75" fill="#FFD264" />
                    </svg>
                    <svg viewBox="0 0 150 180" style="width: 20%; height: auto;">
                        <rect width="100%" height="90" fill="#77B6C2" />
                        <circle cx="75" cy="90" r="75" fill="#77B6C2" />
                    </svg>
                </div>
            </div>
        </div>
    </header>
    <main class=" container oshi-container">
        <div class="row">
            <div class="col-sm">
                <div class="soma oshi-card">
                    <img src="assets\IMG_2982.JPG" data-bs-toggle="modal" data-bs-target="#imageModal"
                        data-src="assets\IMG_2982.JPG" data-caption="Some kind of caption" style="cursor:pointer;">
                    <p class="caption">caption</p>
                    <p class="name">Haru</p>
                </div>
            </div>
            <div class="col-sm">
                <div class="soma oshi-card">
                    <img src="assets\IMG_4136.JPG" data-bs-toggle="modal" data-bs-target="#imageModal"
                        data-src="assets\IMG_4136.JPG" style="cursor:pointer;">
                </div>
            </div>
            <div class="col-sm">
                <div class="soma oshi-card">
                    <img src="assets\IMG_4649.JPG " data-bs-toggle="modal" data-bs-target="#imageModal"
                        data-src="assets\IMG_4649.JPG " style="cursor:pointer;">
                </div>
            </div>

        </div>
        <div id="modal-placeholder"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('modal.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('modal-placeholder').innerHTML = html
                // load modal.js AFTER the modal HTML is injected
                const script = document.createElement('script')
                script.src = 'script.js'
                document.body.appendChild(script)
            })
    </script>
</body>



</html>
