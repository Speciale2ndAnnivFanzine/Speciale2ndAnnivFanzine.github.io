<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speciale 2nd Anniversary Fanzine</title>
    <meta name="description" content="A celebratory fanzine website for Speciale's second anniversary." />
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet">
</head>

<body class="no-scroll">
    <header class="awning-header">
        <div class="awning-brick">
            <span class="awning-brand">Speciale</span>
        </div>
        <div class="awning-band">
            <span class="awning-text">cafe restaurant</span>
        </div>
    </header>
    <div class="landing-hero">
        <!-- Left characters -->
        <div class="characters-left">
            <img src="assets/Suzuna_Fullbody.webp" class="char char-left-1">
            <img src="assets/Berry_Fullbody.webp" class="char char-left-2">
            <img src="assets/Tamako_Fullbody.webp" class="char char-left-3">
        </div>

        <!-- Center: logo + buttons -->
        <div class="hero-center">
            <img src="assets/Logo.webp" class="hero-logo">
            <div class="hero-buttons">
                <button class="menu-btn-hero" onclick="location.href='oshikatsu.html'">Oshikatsu</button>
                <button class="menu-btn-hero"
                    onclick="location.href='https://drive.google.com/drive/folders/1pLFa5UwcnsE_FK7-_dE3b5RgwDMlWHX2?usp=drive_link'">Fanzine</button>
            </div>
        </div>

        <!-- Right characters -->
        <div class="characters-right">
            <img src="assets/Soma_Fullbody.webp" class="char char-right-1">
            <img src="assets/Trout_Fullbody.webp" class="char char-right-2">
        </div>
    </div>
</body>
